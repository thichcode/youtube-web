<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumina Music - YouTube Music Player</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Google Fonts: Inter & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            display: ['Outfit', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#fff1f2',
              400: '#fb7185',
              500: '#f43f5e',
              600: '#e11d48',
              accent: '#ff0055',
            },
            surface: {
              DEFAULT: '#0f0f13',
              card: '#16161e',
              elevated: '#1e1e2a',
              border: '#2a2a3c'
            }
          },
          animation: {
            'spin-slow': 'spin 12s linear infinite',
            'pulse-glow': 'pulseGlow 2.5s ease-in-out infinite',
          },
          keyframes: {
            pulseGlow: {
              '0%, 100%': { opacity: '0.4', transform: 'scale(1)' },
              '50%': { opacity: '0.75', transform: 'scale(1.05)' },
            }
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 15, 19, 0.4);
    }
    ::-webkit-scrollbar-thumb {
      background: #2a2a3c;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #3f3f59;
    }

    /* Range slider custom styling */
    input[type=range] {
      -webkit-appearance: none;
      background: transparent;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 12px;
      width: 12px;
      border-radius: 50%;
      background: #ffffff;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      transition: transform 0.15s ease;
      margin-top: -4px;
    }
    input[type=range]:hover::-webkit-slider-thumb {
      transform: scale(1.3);
      background: #f43f5e;
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      cursor: pointer;
      background: #2a2a3c;
      border-radius: 9999px;
    }

    /* Audio wave bars animation */
    .audio-bar {
      transition: height 0.08s ease-in-out;
    }

    /* Glassmorphism */
    .glass-panel {
      background: rgba(22, 22, 30, 0.75);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    /* Short viewport height optimization for 1-screen auto-fit */
    @media (max-height: 720px) {
      .player-disc-box {
        max-height: 28vh !important;
        max-width: 28vh !important;
      }
      .player-disc-group {
        margin-top: 0.25rem !important;
        margin-bottom: 0.25rem !important;
      }
      #waveVisualizer {
        height: 1.75rem !important;
        margin-top: 0.25rem !important;
        margin-bottom: 0.25rem !important;
      }
    }
  </style>
</head>
<body class="bg-[#0a0a0e] text-slate-100 font-sans antialiased h-screen overflow-hidden flex flex-col select-none" style="height: 100dvh;">

  <!-- Top Navigation Header -->
  <header class="h-16 border-b border-surface-border px-4 lg:px-6 flex items-center justify-between glass-panel z-20 shrink-0">
    <!-- Logo -->
    <div class="flex items-center gap-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-rose-500 to-amber-400 flex items-center justify-center shadow-lg shadow-rose-950/40">
        <i data-lucide="music-2" class="w-5 h-5 text-white"></i>
      </div>
      <div>
        <span class="hidden sm:block font-display font-bold text-lg tracking-wide bg-gradient-to-r from-white via-slate-100 to-slate-400 bg-clip-text text-transparent">Lumina Music</span>
        <span class="hidden sm:block text-[10px] text-brand-400 font-semibold uppercase tracking-wider -mt-1">YouTube Audio & Video</span>
      </div>
    </div>

    <!-- Quick Add Song & Search Form -->
    <div class="flex-1 min-w-0 max-w-xl mx-2 sm:mx-4 relative" id="searchContainer">
      <form id="addSongForm" class="relative flex items-center">
        <i data-lucide="search" class="absolute left-3.5 w-4 h-4 text-slate-400"></i>
        <input 
          type="text" 
          id="ytInput"
          autocomplete="off"
          placeholder="Tìm bài hát, ca sĩ hoặc dán link YouTube..." 
          class="w-full bg-[#12121a] hover:bg-[#181824] focus:bg-[#1a1a28] text-sm text-slate-200 placeholder-slate-500 pl-10 pr-24 py-2 rounded-full border border-surface-border focus:border-brand-500 focus:outline-none transition-all shadow-inner"
        >
        <button 
          type="submit" 
          id="searchSubmitBtn"
          class="absolute right-1.5 px-3 py-1 bg-brand-500 hover:bg-brand-600 active:scale-95 text-white text-xs font-semibold rounded-full transition-all shadow-sm flex items-center gap-1"
        >
          <span id="searchBtnText">Tìm / Thêm</span>
        </button>
      </form>

      <!-- Floating Search Results Dropdown -->
      <div id="searchDropdown" class="hidden absolute left-0 right-0 top-full mt-2 bg-[#14141e]/98 backdrop-blur-xl border border-surface-border rounded-2xl shadow-2xl p-2 z-50 max-h-[70vh] overflow-y-auto space-y-1">
        <!-- Search results injected here -->
      </div>
    </div>

    <!-- Right Actions / Mode toggle -->
    <div class="flex items-center gap-2">
      <button id="openYtBtn" title="Mở bài trong YouTube (nghe nền được với YouTube Premium)" class="px-3 py-1.5 rounded-lg bg-surface-card hover:bg-surface-elevated border border-surface-border text-xs font-medium text-slate-300 flex items-center gap-2 transition-all">
        <i data-lucide="external-link" class="w-4 h-4 text-brand-400"></i>
        <span class="hidden sm:inline">Mở YouTube</span>
      </button>
      <button id="bgModeBtn" title="Chế độ chạy nền: phát tiếp khi tab ẩn / màn hình khóa" class="px-3 py-1.5 rounded-lg bg-surface-card hover:bg-surface-elevated border border-surface-border text-xs font-medium text-slate-300 flex items-center gap-2 transition-all">
        <i data-lucide="picture-in-picture-2" class="w-4 h-4 text-brand-400"></i>
        <span id="bgModeLabel" class="hidden sm:inline">Chạy nền</span>
      </button>
      <button id="toggleViewModeBtn" class="px-3 py-1.5 rounded-lg bg-surface-card hover:bg-surface-elevated border border-surface-border text-xs font-medium text-slate-300 flex items-center gap-2 transition-all">
        <i data-lucide="monitor-play" class="w-4 h-4 text-brand-400"></i>
        <span id="viewModeLabel" class="hidden sm:inline">Xem Video</span>
      </button>
      <div class="w-9 h-9 rounded-full bg-gradient-to-br from-indigo-500 to-brand-500 flex items-center justify-center text-xs font-bold text-white shadow-md">
        PRO
      </div>
    </div>
  </header>

  <!-- Notification Toast -->
  <div id="toast" class="fixed top-20 right-6 z-50 transform translate-y-[-100px] opacity-0 transition-all duration-300 pointer-events-none px-4 py-2.5 rounded-xl bg-slate-900/90 border border-brand-500/40 text-slate-100 text-xs shadow-2xl flex items-center gap-2.5 backdrop-blur-md">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-emerald-400"></i>
    <span id="toastMsg">Đã cập nhật bài hát</span>
  </div>

  <!-- Main Content Area -->
  <main class="flex-1 flex overflow-hidden relative">

    <!-- Center Stage: Player & Visualizer -->
    <section class="flex-1 min-h-0 flex flex-col justify-between p-2 sm:p-4 lg:p-6 overflow-hidden relative">
      <!-- Glow ambient background -->
      <div class="absolute top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2 w-80 h-80 sm:w-96 sm:h-96 bg-brand-500/10 rounded-full blur-[100px] pointer-events-none"></div>

      <!-- Main Playback Presentation -->
      <div class="w-full max-w-3xl mx-auto flex-1 min-h-0 flex flex-col items-center justify-center my-auto z-10 py-1">

        <!-- Mode A: Audio Art + Visualizer Mode (Default) -->
        <div id="visualizerContainer" class="flex flex-col items-center w-full max-w-md transition-all duration-300">
          <!-- Album art disc with glow -->
          <div class="relative group my-2 sm:my-3 player-disc-group">
            <div id="glowBackdrop" class="absolute inset-0 bg-brand-500/20 rounded-full blur-xl group-hover:bg-brand-500/30 transition-all duration-700 animate-pulse-glow"></div>
            
            <div class="player-disc-box relative w-36 h-36 sm:w-44 sm:h-44 md:w-52 md:h-52 lg:w-60 lg:h-60 max-h-[38vh] max-w-[38vh] aspect-square rounded-3xl overflow-hidden shadow-2xl border border-white/10 p-2 bg-surface-card">
              <img 
                id="currentThumbnail" 
                src="https://img.youtube.com/vi/abPmZCZZrFA/hqdefault.jpg" 
                alt="Track art"
                class="w-full h-full object-cover rounded-2xl transform transition-transform duration-700 group-hover:scale-105"
                onerror="this.src='https://placehold.co/400x400/16161e/f43f5e?text=Music'"
              >
              <!-- Disc center vinyl badge -->
              <div class="absolute inset-0 m-auto w-10 h-10 sm:w-12 sm:h-12 bg-black/75 backdrop-blur-md rounded-full border border-white/20 flex items-center justify-center">
                <div class="w-3 h-3 rounded-full bg-brand-500 animate-ping"></div>
              </div>
            </div>
          </div>

          <!-- Dynamic Soundwave Visualizer Bars -->
          <div class="w-full h-8 sm:h-11 flex items-end justify-center gap-1 sm:gap-1.5 px-4 my-1 sm:my-2" id="waveVisualizer">
            <!-- Dynamically generated visual bars -->
          </div>

          <!-- Track Info -->
          <div class="text-center mt-1 sm:mt-2 max-w-full px-2">
            <h1 id="currentTitle" class="font-display font-bold text-lg sm:text-xl lg:text-2xl text-white tracking-tight truncate">Đang tải bài hát...</h1>
            <p id="currentArtist" class="text-xs sm:text-sm font-medium text-slate-400 mt-0.5 truncate">Lumina Music Player</p>
          </div>
        </div>

        <!-- Mode B: YouTube Video Frame Container -->
        <div id="ytVideoWrapper" class="hidden w-full max-w-2xl aspect-video max-h-[50vh] bg-black rounded-2xl overflow-hidden border border-surface-border shadow-2xl relative my-auto">
          <!-- The YouTube Iframe is mounted inside #ytplayer -->
          <div id="ytplayer" class="w-full h-full pointer-events-auto"></div>
          <button id="minimizeVideoBtn" class="absolute top-2.5 right-2.5 bg-black/60 hover:bg-black/90 text-white px-2 py-1.5 rounded-full backdrop-blur-md border border-white/10 transition-all text-xs flex items-center gap-1.5">
            <i data-lucide="minimize-2" class="w-3.5 h-3.5"></i>
            <span class="text-[11px]">Thu nhỏ</span>
          </button>
        </div>

      </div>

      <!-- Quick status indicator bar -->
      <div class="w-full max-w-3xl mx-auto flex items-center justify-between text-xs text-slate-400 py-1.5 border-t border-surface-border/50 shrink-0">
        <div class="flex items-center gap-2">
          <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span id="playerStateText" class="truncate max-w-[200px] sm:max-w-none">Sẵn sàng phát nhạc</span>
        </div>
        <div class="flex items-center gap-3">
          <span id="queueCountIndicator">0 bài</span>
          <button id="toggleQueueDrawerBtn" class="lg:hidden text-brand-400 hover:text-brand-300 font-semibold flex items-center gap-1 text-xs">
            <i data-lucide="list-music" class="w-3.5 h-3.5"></i> Danh sách
          </button>
        </div>
      </div>
    </section>

    <!-- Right Sidebar: Queue / Curated Playlist -->
    <aside id="queueSidebar" class="fixed inset-y-0 right-0 w-80 lg:w-96 bg-surface-card/95 backdrop-blur-xl border-l border-surface-border flex flex-col z-30 transition-transform duration-300 translate-x-full lg:translate-x-0 lg:static">
      <!-- Sidebar Header -->
      <div class="p-3.5 border-b border-surface-border flex items-center justify-between shrink-0">
        <div class="flex items-center gap-2">
          <i data-lucide="list-music" class="w-5 h-5 text-brand-500"></i>
          <h2 class="font-display font-bold text-sm sm:text-base text-white">Top Hit & Hàng đợi</h2>
        </div>
        <div class="flex items-center gap-1.5">
          <button id="resetPlaylistBtn" title="Khôi phục danh sách Top Hit mặc định" class="p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-surface-elevated transition-colors">
            <i data-lucide="rotate-ccw" class="w-4 h-4"></i>
          </button>
          <button id="closeQueueBtn" class="lg:hidden p-1.5 rounded-lg text-slate-400 hover:text-white hover:bg-surface-elevated">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- Playlist Selection Tabs -->
      <div class="px-3 sm:px-4 pt-2.5 flex gap-1.5 overflow-x-auto text-xs pb-1.5 shrink-0" id="tabGroup">
        <button id="filterAll" class="tab-btn px-2.5 py-1 rounded-full bg-brand-500 text-white font-semibold text-[11px] whitespace-nowrap">Tất cả</button>
        <button id="filterVpop" class="tab-btn px-2.5 py-1 rounded-full bg-surface-elevated hover:bg-[#252535] text-slate-400 font-medium text-[11px] whitespace-nowrap transition-colors">Top V-Pop</button>
        <button id="filterGlobal" class="tab-btn px-2.5 py-1 rounded-full bg-surface-elevated hover:bg-[#252535] text-slate-400 font-medium text-[11px] whitespace-nowrap transition-colors">Global Hits</button>
        <button id="filterLofi" class="tab-btn px-2.5 py-1 rounded-full bg-surface-elevated hover:bg-[#252535] text-slate-400 font-medium text-[11px] whitespace-nowrap transition-colors">Lofi Chill</button>
      </div>

      <!-- Songs Queue List -->
      <div id="playlistContainer" class="flex-1 overflow-y-auto p-3 space-y-1.5">
        <!-- Injected via JavaScript -->
      </div>

      <!-- Sidebar Footer hint -->
      <div class="p-3 bg-surface/60 border-t border-surface-border text-center text-[11px] text-slate-400">
        Mẹo: Bạn có thể thêm bất kỳ link YouTube hoặc Video ID nào ở thanh tìm kiếm phía trên!
      </div>
    </aside>

    <!-- Overlay backdrop for mobile drawer -->
    <div id="queueBackdrop" class="fixed inset-0 bg-black/60 z-20 hidden lg:hidden backdrop-blur-xs"></div>
  </main>

  <!-- Bottom Player Bar (Persistent) -->
  <footer class="h-20 sm:h-24 bg-surface-card/95 border-t border-surface-border px-2 sm:px-4 lg:px-8 flex items-center justify-between glass-panel z-40 shrink-0">
    
    <!-- Left: Now Playing Mini Details -->
    <div class="flex items-center gap-2 sm:gap-3 w-1/4 min-w-0">
      <div class="w-10 h-10 sm:w-12 sm:h-12 rounded-xl overflow-hidden shrink-0 bg-surface-elevated border border-white/5 relative group cursor-pointer" id="miniThumbClick">
        <img id="barThumbnail" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=120" alt="Track thumbnail" class="w-full h-full object-cover">
        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
          <i data-lucide="maximize-2" class="w-4 h-4 text-white"></i>
        </div>
      </div>
      <div class="min-w-0 pr-2 hidden sm:block">
        <h4 id="barTitle" class="text-sm font-semibold text-white truncate hover:underline cursor-pointer">Đang tải bài hát...</h4>
        <p id="barArtist" class="text-xs text-slate-400 truncate">Vui lòng chọn bài</p>
      </div>
      <button id="likeBtn" class="text-slate-400 hover:text-brand-500 transition-colors p-1 hidden sm:block">
        <i data-lucide="heart" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Center: Playback Controls & Timeline -->
    <div class="flex flex-col items-center gap-1.5 flex-1 sm:w-2/4 sm:flex-none max-w-xl">
      <!-- Buttons -->
      <div class="flex items-center gap-2 sm:gap-5">
        <button id="shuffleBtn" title="Phát ngẫu nhiên" class="text-slate-400 hover:text-white transition-colors p-1.5 rounded-lg active:scale-95">
          <i data-lucide="shuffle" class="w-4 h-4"></i>
        </button>
        <button id="prevBtn" title="Bài trước" class="text-slate-200 hover:text-white transition-colors p-1.5 rounded-lg active:scale-95">
          <i data-lucide="skip-back" class="w-5 h-5 fill-current"></i>
        </button>
        <button id="playPauseBtn" title="Phát / Dừng" class="w-10 h-10 sm:w-11 sm:h-11 rounded-full bg-white text-black hover:bg-brand-500 hover:text-white flex items-center justify-center transition-all duration-200 shadow-lg shadow-white/10 active:scale-95">
          <i id="playIcon" data-lucide="play" class="w-5 h-5 fill-current ml-0.5"></i>
        </button>
        <button id="nextBtn" title="Bài tiếp theo" class="text-slate-200 hover:text-white transition-colors p-1.5 rounded-lg active:scale-95">
          <i data-lucide="skip-forward" class="w-5 h-5 fill-current"></i>
        </button>
        <button id="repeatBtn" title="Lặp lại" class="text-slate-400 hover:text-white transition-colors p-1.5 rounded-lg active:scale-95">
          <i data-lucide="repeat" class="w-4 h-4"></i>
        </button>
      </div>

      <!-- Seek Bar Timeline -->
      <div class="w-full flex items-center gap-3 text-[11px] font-mono text-slate-400">
        <span id="currentTimeLabel">0:00</span>
        <div class="relative flex-1 flex items-center">
          <input 
            type="range" 
            id="seekBar" 
            min="0" 
            max="100" 
            value="0" 
            step="0.1"
            class="w-full h-1 bg-surface-border rounded-lg appearance-none cursor-pointer"
          >
          <!-- Filled progress line overlay -->
          <div id="seekProgressFill" class="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-brand-500 rounded-full pointer-events-none" style="width: 0%;"></div>
        </div>
        <span id="durationLabel">0:00</span>
      </div>
    </div>

    <!-- Right: Volume & Options -->
    <div class="flex items-center justify-end gap-2 sm:gap-3 w-1/4 min-w-0">
      <button id="muteBtn" class="text-slate-400 hover:text-white transition-colors p-1.5">
        <i id="volIcon" data-lucide="volume-2" class="w-4 h-4"></i>
      </button>
      <div class="w-12 sm:w-28 relative flex items-center">
        <input 
          type="range" 
          id="volumeBar" 
          min="0" 
          max="100" 
          value="80" 
          class="w-full h-1 bg-surface-border rounded-lg appearance-none cursor-pointer"
        >
        <div id="volProgressFill" class="absolute left-0 top-1/2 -translate-y-1/2 h-1 bg-slate-300 rounded-full pointer-events-none" style="width: 80%;"></div>
      </div>
      <button id="desktopQueueToggle" class="hidden sm:block text-slate-400 hover:text-white p-1.5 rounded-lg transition-colors ml-1">
        <i data-lucide="list-music" class="w-5 h-5"></i>
      </button>
    </div>

  </footer>

  <!-- YouTube IFrame API Script -->
  <script src="https://www.youtube.com/iframe_api"></script>

  <!-- Application Logic -->

      return [...DEFAULT_PLAYLIST];

    /* ==========================================================
       2. Initialize Soundwave Bars
       ========================================================== */
    const BAR_COUNT = 24;
    function initWaveVisualizer() {
      waveVisualizer.innerHTML = '';
      for (let i = 0; i < BAR_COUNT; i++) {
        const bar = document.createElement('div');
        bar.className = 'w-1 sm:w-1 bg-gradient-to-t from-brand-600 via-rose-500 to-amber-300 rounded-full audio-bar opacity-80';
        bar.style.height = '6px';
        waveVisualizer.appendChild(bar);
      }
    }

    function startVisualizerAnimation() {
      if (visualizerInterval) clearInterval(visualizerInterval);
      const bars = waveVisualizer.children;
      visualizerInterval = setInterval(() => {
        if (!isPlaying) {
          for (let bar of bars) bar.style.height = '6px';
          return;
        }
        for (let i = 0; i < bars.length; i++) {
          // Dynamic wave shape calculation with rhythmic bounce
          const time = Date.now() / 150;
          const factor = Math.sin(time + i * 0.35) * 0.5 + 0.5;
          const randomH = Math.floor(factor * 24 + Math.random() * 10 + 4);
          bars[i].style.height = `${randomH}px`;
        }
      }, 90);
    }

    function stopVisualizerAnimation() {
      if (visualizerInterval) clearInterval(visualizerInterval);
      const bars = waveVisualizer.children;
      for (let bar of bars) {
        bar.style.height = '6px';
      }
    }

    /* ==========================================================
       3. YouTube Iframe Player Integration
       ========================================================== */
    window.onYouTubeIframeAPIReady = function() {
      ytPlayer = new YT.Player('ytplayer', {
        height: '100%',
        width: '100%',
        videoId: playlist[currentIndex].id,
        playerVars: {
          autoplay: 0,
          controls: 1,
          rel: 0,
          showinfo: 0,
          modestbranding: 1,
          playsinline: 1,
          iv_load_policy: 3,
          fs: 1
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange,
          'onError': onPlayerError
        }
      });
    };

    function onPlayerReady(event) {
      ytPlayer.setVolume(currentVolume);
      updateTrackDisplay();
      renderPlaylist();
      showToast('Hệ thống YouTube Player đã sẵn sàng!');
      playerStateText.textContent = 'Đã kết nối YouTube';
    }

    function onPlayerStateChange(event) {
      // YT.PlayerState: -1: unstarted, 0: ended, 1: playing, 2: paused, 3: buffering, 5: cued
      if (event.data === YT.PlayerState.PLAYING) {
        isPlaying = true;
        updatePlayPauseIcon(true);
        startTrackingProgress();
        startVisualizerAnimation();
        playerStateText.textContent = 'Đang phát nhạc';
        if (bgMode) {
          syncMediaSessionState('playing');
          startSilentAudio();
        }
        // Auto update video title if available from YouTube player
        const videoData = ytPlayer.getVideoData();
        if (videoData && videoData.title && (playlist[currentIndex].title.startsWith('YouTube Song') || playlist[currentIndex].title.startsWith('Đang lấy tên'))) {
          playlist[currentIndex].title = videoData.title;
          playlist[currentIndex].artist = videoData.author || 'YouTube';
          savePlaylist();
          updateTrackDisplay();
          renderPlaylist(currentFilter);
        }
      } else if (event.data === YT.PlayerState.PAUSED) {
        isPlaying = false;
        updatePlayPauseIcon(false);
        stopVisualizerAnimation();
        playerStateText.textContent = 'Tạm dừng';
        if (bgMode) {
          syncMediaSessionState('paused');
          stopSilentAudio();
        }
      } else if (event.data === YT.PlayerState.BUFFERING) {
        playerStateText.textContent = 'Đang tải dữ liệu...';
      } else if (event.data === YT.PlayerState.ENDED) {
        handleTrackEnded();
      }
    }

    function onPlayerError(e) {
      console.warn("YouTube Player error:", e.data);
      showToast('Lỗi phát video này (Bị giới hạn bản quyền hoặc không cho nhúng). Đang chuyển tiếp...');
      playerStateText.textContent = 'Lỗi phát bài, chuyển bài kế tiếp';
      setTimeout(() => {
        playNext();
      }, 1500);
    }

    /* ==========================================================
       4. Audio & Playback Handlers
       ========================================================== */
    function playTrackAtIndex(index) {
      if (index < 0 || index >= playlist.length) return;
      currentIndex = index;
      const track = playlist[currentIndex];
      
      if (ytPlayer && ytPlayer.loadVideoById) {
        ytPlayer.loadVideoById(track.id);
        isPlaying = true;
        updatePlayPauseIcon(true);
      }
      
      updateTrackDisplay();
      renderPlaylist();
    }

    function togglePlayPause() {
      if (!ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function playNext() {
      if (playlist.length === 0) return;

      if (isShuffle) {
        let randomIndex = Math.floor(Math.random() * playlist.length);
        if (playlist.length > 1 && randomIndex === currentIndex) {
          randomIndex = (randomIndex + 1) % playlist.length;
        }
        playTrackAtIndex(randomIndex);
      } else {
        if (currentIndex < playlist.length - 1) {
          playTrackAtIndex(currentIndex + 1);
        } else {
          // Reached end
          if (repeatMode === 1) { // Repeat all
            playTrackAtIndex(0);
          } else {
            showToast('Đã hết danh sách bài hát');
            ytPlayer.stopVideo();
            isPlaying = false;
            updatePlayPauseIcon(false);
            stopVisualizerAnimation();
          }
        }
      }
    }

    function playPrevious() {
      if (!ytPlayer) return;
      // If current song played more than 3 seconds, replay it
      const current = ytPlayer.getCurrentTime ? ytPlayer.getCurrentTime() : 0;
      if (current > 4) {
        ytPlayer.seekTo(0, true);
        return;
      }

      if (currentIndex > 0) {
        playTrackAtIndex(currentIndex - 1);
      } else {
        playTrackAtIndex(playlist.length - 1);
      }
    }

    function handleTrackEnded() {
      if (repeatMode === 2) { // Repeat one
        if (ytPlayer) {
          ytPlayer.seekTo(0);
          ytPlayer.playVideo();
        }
      } else {
        playNext();
      }
    }

    /* ==========================================================
       5. Timeline Seek & Volume Control
       ========================================================== */
    function startTrackingProgress() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        if (!ytPlayer || !ytPlayer.getCurrentTime || !ytPlayer.getDuration || isSeeking) return;

        const current = ytPlayer.getCurrentTime() || 0;
        const total = ytPlayer.getDuration() || 0;

        currentTimeLabel.textContent = formatTime(current);
        if (total > 0) {
          durationLabel.textContent = formatTime(total);
          const percent = (current / total) * 100;
          seekBar.value = percent;
          seekProgressFill.style.width = `${percent}%`;
        }
      }, 500);
    }

    function formatTime(seconds) {
      if (isNaN(seconds) || seconds < 0) return '0:00';
      const mins = Math.floor(seconds / 60);
      const secs = Math.floor(seconds % 60);
      return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
    }

    // Seek bar interactions
    seekBar.addEventListener('input', (e) => {
      isSeeking = true;
      const percent = e.target.value;
      seekProgressFill.style.width = `${percent}%`;
      if (ytPlayer && ytPlayer.getDuration) {
        const total = ytPlayer.getDuration();
        const currentTarget = (percent / 100) * total;
        currentTimeLabel.textContent = formatTime(currentTarget);
      }
    });

    seekBar.addEventListener('change', (e) => {
      if (ytPlayer && ytPlayer.getDuration) {
        const total = ytPlayer.getDuration();
        const seekToSeconds = (e.target.value / 100) * total;
        ytPlayer.seekTo(seekToSeconds, true);
      }
      isSeeking = false;
    });

    // Volume Control
    volumeBar.addEventListener('input', (e) => {
      const vol = parseInt(e.target.value, 10);
      setVolumeLevel(vol);
    });

    function setVolumeLevel(vol) {
      currentVolume = vol;
      volumeBar.value = vol;
      volProgressFill.style.width = `${vol}%`;
      if (ytPlayer && ytPlayer.setVolume) {
        ytPlayer.setVolume(vol);
        if (vol === 0) {
          ytPlayer.mute();
          isMuted = true;
          updateVolumeIcon(0);
        } else {
          ytPlayer.unMute();
          isMuted = false;
          updateVolumeIcon(vol);
        }
      }
    }

    muteBtn.addEventListener('click', () => {
      if (!ytPlayer) return;
      if (isMuted) {
        ytPlayer.unMute();
        isMuted = false;
        setVolumeLevel(currentVolume > 0 ? currentVolume : 50);
      } else {
        ytPlayer.mute();
        isMuted = true;
        volProgressFill.style.width = '0%';
        volumeBar.value = 0;
        updateVolumeIcon(0);
      }
    });

    function updateVolumeIcon(vol) {
      if (vol === 0 || isMuted) {
        volIcon.setAttribute('data-lucide', 'volume-x');
      } else if (vol < 50) {
        volIcon.setAttribute('data-lucide', 'volume-1');
      } else {
        volIcon.setAttribute('data-lucide', 'volume-2');
      }
      lucide.createIcons();
    }

    /* ==========================================================
       6. UI Updates, Shuffle, Repeat & View Modes
       ========================================================== */
    function updateTrackDisplay() {
      if (!playlist[currentIndex]) return;
      const track = playlist[currentIndex];

      // Update Top Stage
      currentTitle.textContent = track.title;
      currentArtist.textContent = track.artist;
      currentThumbnail.src = track.thumbnail || `https://img.youtube.com/vi/${track.id}/hqdefault.jpg`;

      // Update Bottom Bar
      barTitle.textContent = track.title;
      barArtist.textContent = track.artist;
      barThumbnail.src = track.thumbnail || `https://img.youtube.com/vi/${track.id}/hqdefault.jpg`;

      queueCountIndicator.textContent = `${playlist.length} bài trong danh sách`;
      if (bgMode) updateMediaSessionMetadata();
    }

    function updatePlayPauseIcon(playing) {
      if (playing) {
        playIcon.setAttribute('data-lucide', 'pause');
        playIcon.classList.remove('ml-0.5');
      } else {
        playIcon.setAttribute('data-lucide', 'play');
        playIcon.classList.add('ml-0.5');
      }
      lucide.createIcons();
    }

    // Shuffle Mode
    shuffleBtn.addEventListener('click', () => {

    // Repeat Mode (0: None, 1: All, 2: One)

    // Toggle Video Mode vs Visualizer Mode

    toggleViewModeBtn.addEventListener('click', () => setVideoMode(!isVideoMode));
    minimizeVideoBtn.addEventListener('click', () => setVideoMode(false));

    /* ==========================================================
       6b. Background Play Mode (Silent Audio Loop + Media Session)
       ========================================================== */
    let bgMode = localStorage.getItem('lumina_bgmode') === '1';

    // Silent Audio Keep-Alive for iOS Safari & Mobile Browsers
    // A valid minimal base64 silent WAV audio file (0.5s loop)
    const SILENT_WAV_BASE64 = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
    let silentAudioElement = null;

    function initSilentAudio() {
      if (!silentAudioElement) {
        silentAudioElement = new Audio(SILENT_WAV_BASE64);
        silentAudioElement.loop = true;
        silentAudioElement.volume = 0.01; // extremely low volume to keep audio pipeline active
        silentAudioElement.setAttribute('playsinline', 'true');
      }
    }

    function startSilentAudio() {
      initSilentAudio();
      if (silentAudioElement && silentAudioElement.paused) {
        silentAudioElement.play().catch(e => {
          // Requires user interaction once
          console.log('Silent audio waiting for interaction:', e);
        });
      }
    }

    function stopSilentAudio() {
      if (silentAudioElement && !silentAudioElement.paused) {
        silentAudioElement.pause();
      }
    }

    function updateMediaSessionMetadata() {
      if (!('mediaSession' in navigator)) return;
      const track = playlist[currentIndex];
      if (!track) return;
      const art = track.thumbnail || `https://img.youtube.com/vi/${track.id}/hqdefault.jpg`;
      try {
        navigator.mediaSession.metadata = new MediaMetadata({
          title: track.title,
          artist: track.artist || 'YouTube',
          album: 'Lumina Music',
          artwork: [
            { src: art, sizes: '512x512', type: 'image/jpeg' },
            { src: art, sizes: '256x256', type: 'image/jpeg' },
          ],
        });
      } catch (e) { /* bỏ qua nếu trình duyệt không hỗ trợ */ }
    }

    function syncMediaSessionState(state) {
      if (!('mediaSession' in navigator)) return;
      try { navigator.mediaSession.playbackState = state; } catch (e) {}
    }

    function setupMediaSession() {
      if (!('mediaSession' in navigator)) return;
      updateMediaSessionMetadata();
      navigator.mediaSession.setActionHandler('play', () => { 
        startSilentAudio();
        if (ytPlayer && ytPlayer.playVideo) ytPlayer.playVideo(); 
      });
      navigator.mediaSession.setActionHandler('pause', () => { 
        stopSilentAudio();
        if (ytPlayer && ytPlayer.pauseVideo) ytPlayer.pauseVideo(); 
      });
      navigator.mediaSession.setActionHandler('previoustrack', () => playPrevious());
      navigator.mediaSession.setActionHandler('nexttrack', () => playNext());
      navigator.mediaSession.setActionHandler('seekto', (details) => {
        if (ytPlayer && ytPlayer.seekTo && details.seekTime != null) ytPlayer.seekTo(details.seekTime, true);
      });
      syncMediaSessionState(isPlaying ? 'playing' : 'paused');
    }

    function setBackgroundMode(enable) {
      bgMode = enable;
      localStorage.setItem('lumina_bgmode', enable ? '1' : '0');
      if (enable) {
        bgModeBtn.classList.add('bg-brand-500/20', 'border-brand-500/40', 'text-brand-400');
        bgModeBtn.classList.remove('text-slate-300');
        bgModeLabel.textContent = 'Đang chạy nền';
        setupMediaSession();
        if (isPlaying) startSilentAudio();
        const isIOS = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIOS) {
          showToast('Đã bật chạy nền cho iOS (Khóa màn hình -> Bấm Play ở Control Center nếu bị khựng)');
        } else {
          showToast('Đã bật chế độ chạy nền');
        }
      } else {
        bgModeBtn.classList.remove('bg-brand-500/20', 'border-brand-500/40', 'text-brand-400');
        bgModeBtn.classList.add('text-slate-300');
        bgModeLabel.textContent = 'Chạy nền';
        stopSilentAudio();
        if ('mediaSession' in navigator) {
          navigator.mediaSession.metadata = null;
          syncMediaSessionState('none');
        }
        showToast('Đã tắt chế độ chạy nền');
      }
      lucide.createIcons();
    }

    // Khi quay lại tab sau khi ẩn: nếu đang phát mà bị dừng thì phát lại
    document.addEventListener('visibilitychange', () => {
      if (!bgMode) return;
      if (document.hidden) {
        // Tab bị ẩn / khóa màn hình: nếu đang phát, duy trì silent audio
        if (isPlaying) startSilentAudio();
        return;
      }
      // Tab hiện lại
      if (ytPlayer && ytPlayer.getPlayerState && ytPlayer.getPlayerState() === 2 && isPlaying) {
        ytPlayer.playVideo();
      }
      if (isPlaying) {
        startSilentAudio();
        setupMediaSession();
      }
    });

    bgModeBtn.addEventListener('click', () => setBackgroundMode(!bgMode));

    // Mở bài hiện tại trong YouTube (app/website) — hỗ trợ nghe nền với Premium
    function openInYouTube() {
      const track = playlist[currentIndex];
      if (!track) return;
      window.open(`https://www.youtube.com/watch?v=${track.id}`, '_blank', 'noopener');
    }
    openYtBtn.addEventListener('click', openInYouTube);

    // Khôi phục trạng thái đã lưu khi tải trang
    if (bgMode) {
      bgModeBtn.classList.add('bg-brand-500/20', 'border-brand-500/40', 'text-brand-400');
      bgModeBtn.classList.remove('text-slate-300');
      bgModeLabel.textContent = 'Đang chạy nền';
    }

    /* ==========================================================
       7. Playlist Rendering and Queue Management
       ========================================================== */
    function renderPlaylist(filterCategory = null) {
      if (filterCategory !== null) currentFilter = filterCategory;
      playlistContainer.innerHTML = '';

      let listToRender = playlist;
      if (currentFilter && currentFilter !== 'all') {
        listToRender = playlist.filter(track => track.category === currentFilter);
      }

      if (listToRender.length === 0) {
        playlistContainer.innerHTML = `
          <div class="p-8 text-center text-slate-500 text-sm">
            <i data-lucide="music" class="w-8 h-8 mx-auto mb-2 opacity-50"></i>
            Không có bài hát nào trong mục này
          </div>
        `;
        lucide.createIcons();
        return;
      }

      listToRender.forEach((track) => {
        const actualIndex = playlist.indexOf(track);
        const isCurrent = actualIndex === currentIndex;

        const row = document.createElement('div');
        row.className = `group flex items-center justify-between p-2 rounded-xl transition-all cursor-pointer ${
          isCurrent 
            ? 'bg-brand-500/15 border border-brand-500/30 text-white' 
            : 'hover:bg-surface-elevated/70 text-slate-300 border border-transparent'
        }`;

        row.innerHTML = `
          <div class="flex items-center gap-3 min-w-0 flex-1">
            <div class="relative w-11 h-11 rounded-lg overflow-hidden shrink-0 bg-black/40">
              <img 
                src="${track.thumbnail || `https://img.youtube.com/vi/${track.id}/hqdefault.jpg`}" 
                alt="${track.title}"
                class="w-full h-full object-cover"
                onerror="this.src='https://placehold.co/100x100/1e1e2a/f43f5e?text=Music'"
              >
              ${isCurrent ? `
                <div class="absolute inset-0 bg-black/50 flex items-center justify-center">
                  <div class="w-2.5 h-2.5 rounded-full bg-brand-500 animate-ping"></div>
                </div>
              ` : ''}
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-xs font-semibold truncate ${isCurrent ? 'text-brand-400' : 'text-slate-100'}">${track.title}</p>
              <p class="text-[11px] text-slate-400 truncate mt-0.5">${track.artist || 'YouTube'}</p>
            </div>
          </div>
          <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100">
            <button class="remove-btn p-1.5 rounded-md hover:text-rose-400 hover:bg-rose-500/10 text-slate-400 transition-colors" title="Xóa khỏi danh sách">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;

        // Click row to play
        row.addEventListener('click', (e) => {
          if (e.target.closest('.remove-btn')) return;
          playTrackAtIndex(actualIndex);
        });

        // Click remove
        const removeBtn = row.querySelector('.remove-btn');
        removeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteSong(actualIndex);
        });

        playlistContainer.appendChild(row);
      });

      lucide.createIcons();
    }

    function deleteSong(index) {
      if (playlist.length <= 1) {
        showToast('Cần giữ lại ít nhất 1 bài trong danh sách');
        return;
      }

      const isDeletingCurrent = index === currentIndex;
      const deletedTrack = playlist.splice(index, 1)[0];
      savePlaylist();

      if (isDeletingCurrent) {
        currentIndex = index >= playlist.length ? 0 : index;
        playTrackAtIndex(currentIndex);
      } else if (index < currentIndex) {
        currentIndex--;
      }

      renderPlaylist(currentFilter);
      showToast(`Đã xóa "${deletedTrack.title.substring(0, 24)}..."`);
    }

    /* ==========================================================
       8. Extract YouTube ID & Add Song Support
       ========================================================== */
    function extractYouTubeId(urlOrId) {
      if (!urlOrId) return null;
      urlOrId = urlOrId.trim();

      // If directly an 11-char ID
      if (/^[a-zA-Z0-9_-]{11}$/.test(urlOrId)) {
        return urlOrId;
      }

      // Regex for various YouTube URL forms (youtu.be, youtube.com/watch?v=, embed, etc.)
      const regExp = /(?:youtube\.com\/(?:[^\/]+\/.+\/|(?:v|e(?:mbed)?)\/|.*[?&]v=)|youtu\.be\/)([^"&?\/\s]{11})/;
      const match = urlOrId.match(regExp);
      return match ? match[1] : null;
    }

    function addTrackToPlaylist(track, playNow = true) {
      // Check if already in list
      const existing = playlist.findIndex(item => item.id === track.id);
      if (existing !== -1) {
        showToast('Bài hát đã có trong danh sách!');
        if (playNow) playTrackAtIndex(existing);
        return;
      }

      if (playNow) {
        playlist.unshift(track);
        savePlaylist();
        currentIndex = 0;
        playTrackAtIndex(0);
        updateTabStyles('filterAll');
        renderPlaylist('all');
        showToast(`Đang phát: "${track.title.substring(0, 24)}..."`);
      } else {
        playlist.push(track);
        savePlaylist();
        renderPlaylist(currentFilter);
        showToast(`Đã thêm vào hàng đợi: "${track.title.substring(0, 24)}..."`);
      }
      queueCountIndicator.textContent = `${playlist.length} bài`;
    }

    // Public Invidious instances fallback list for YouTube search
    const SEARCH_INSTANCES = [
      'https://yt.chocolatemoo53.com',
      'https://invidious.jing.rocks',
      'https://inv.vern.cc'
    ];

    async function searchYouTube(query) {
      searchDropdown.classList.remove('hidden');
      searchDropdown.innerHTML = `
        <div class="p-6 text-center text-slate-400 text-xs flex flex-col items-center justify-center gap-2">
          <div class="w-6 h-6 border-2 border-brand-500 border-t-transparent rounded-full animate-spin"></div>
          <span>Đang tìm kiếm YouTube: "<strong class="text-white">${query}</strong>"...</span>
        </div>
      `;

      let results = null;

      for (const instance of SEARCH_INSTANCES) {
        try {
          const res = await fetch(`${instance}/api/v1/search?q=${encodeURIComponent(query)}&type=video`, {
            signal: AbortSignal.timeout(5000)
          });
          if (res.ok) {
            const data = await res.json();
            if (Array.isArray(data)) {
              results = data
                .filter(x => x.videoId && x.title)
                .slice(0, 6)
                .map(x => ({
                  id: x.videoId,
                  title: x.title,
                  artist: x.author || 'YouTube',
                  category: 'search',
                  thumbnail: `https://img.youtube.com/vi/${x.videoId}/hqdefault.jpg`,
                  duration: x.lengthSeconds ? formatTime(x.lengthSeconds) : ''
                }));
              if (results.length > 0) break;
            }
          }
        } catch (e) {
          console.warn(`Search failed on ${instance}:`, e);
        }
      }

      if (!results || results.length === 0) {
        searchDropdown.innerHTML = `
          <div class="p-5 text-center text-slate-400 text-xs">
            <i data-lucide="alert-circle" class="w-6 h-6 mx-auto mb-2 text-amber-400 opacity-80"></i>
            <p class="font-medium text-slate-200">Không tìm thấy kết quả hoặc máy chủ tìm kiếm đang bận.</p>
            <p class="text-[11px] text-slate-500 mt-1">Mẹo: Bạn có thể dán trực tiếp link bài hát từ YouTube để nghe ngay!</p>
          </div>
        `;
        lucide.createIcons();
        return;
      }

      renderSearchResults(results, query);
    }

    function renderSearchResults(results, query) {
      searchDropdown.innerHTML = `
        <div class="px-3 py-1.5 text-[11px] font-semibold text-slate-400 border-b border-surface-border flex items-center justify-between">
          <span>KẾT QUẢ TÌM KIẾM CHO "${query.toUpperCase()}"</span>
          <button id="closeSearchDropdown" class="text-slate-400 hover:text-white p-1 rounded-md">
            <i data-lucide="x" class="w-3.5 h-3.5"></i>
          </button>
        </div>
        <div class="space-y-1 p-1 max-h-[60vh] overflow-y-auto" id="searchResultsList"></div>
      `;

      const listContainer = document.getElementById('searchResultsList');

      results.forEach(item => {
        const row = document.createElement('div');
        row.className = 'group flex items-center justify-between p-2 rounded-xl hover:bg-surface-elevated/80 transition-all text-slate-200 cursor-pointer border border-transparent hover:border-white/5';
        
        row.innerHTML = `
          <div class="flex items-center gap-3 min-w-0 flex-1 pr-2">
            <div class="relative w-12 h-12 rounded-lg overflow-hidden shrink-0 bg-black/40">
              <img src="${item.thumbnail}" alt="${item.title}" class="w-full h-full object-cover">
              ${item.duration ? `<span class="absolute bottom-0.5 right-0.5 px-1 bg-black/80 text-[9px] rounded font-mono text-white">${item.duration}</span>` : ''}
            </div>
            <div class="min-w-0 flex-1">
              <p class="text-xs font-semibold text-white truncate group-hover:text-brand-400 transition-colors">${item.title}</p>
              <p class="text-[11px] text-slate-400 truncate mt-0.5">${item.artist}</p>
            </div>
          </div>
          <div class="flex items-center gap-1 shrink-0">
            <button class="play-now-btn px-2.5 py-1 rounded-full bg-brand-500 hover:bg-brand-600 active:scale-95 text-white text-[11px] font-medium transition-all shadow-sm flex items-center gap-1">
              <i data-lucide="play" class="w-3 h-3 fill-current"></i>
              <span>Phát</span>
            </button>
            <button class="queue-btn p-1.5 rounded-full hover:bg-white/10 text-slate-400 hover:text-white transition-colors" title="Thêm vào hàng đợi">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i>
            </button>
          </div>
        `;

        // Click row or "Phát" to play immediately
        row.addEventListener('click', (e) => {
          if (e.target.closest('.queue-btn')) return;
          addTrackToPlaylist(item, true);
          searchDropdown.classList.add('hidden');
          ytInput.value = '';
        });

        // Click "+" to add to queue only
        const queueBtn = row.querySelector('.queue-btn');
        queueBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          addTrackToPlaylist(item, false);
          queueBtn.innerHTML = '<i data-lucide="check" class="w-3.5 h-3.5 text-emerald-400"></i>';
          lucide.createIcons();
        });

        listContainer.appendChild(row);
      });

      document.getElementById('closeSearchDropdown').addEventListener('click', (e) => {
        e.stopPropagation();
        searchDropdown.classList.add('hidden');
      });

      lucide.createIcons();
    }

    addSongForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const rawInput = ytInput.value.trim();
      if (!rawInput) return;

      const videoId = extractYouTubeId(rawInput);

      if (videoId) {
        // Direct YouTube Link or ID
        searchDropdown.classList.add('hidden');
        const existing = playlist.findIndex(item => item.id === videoId);
        if (existing !== -1) {
          showToast('Bài hát này đã có trong danh sách! Đang mở bài...');
          playTrackAtIndex(existing);
          ytInput.value = '';
          return;
        }

        const newTrack = {
          id: videoId,
          title: `Đang lấy tên [${videoId}]...`,
          artist: 'YouTube',
          category: 'custom',
          thumbnail: `https://img.youtube.com/vi/${videoId}/hqdefault.jpg`
        };

        addTrackToPlaylist(newTrack, true);
        ytInput.value = '';

        // Fetch oEmbed title & artist asynchronously
        fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${videoId}`)
          .then(res => res.json())
          .then(data => {
            if (data && data.title) {
              newTrack.title = data.title;
              newTrack.artist = data.author_name || 'YouTube';
              savePlaylist();
              updateTrackDisplay();
              renderPlaylist(currentFilter);
            }
          })
          .catch(() => {});
      } else {
        // Keyword Search
        searchYouTube(rawInput);
      }
    });

    // Close search dropdown on click outside or Escape
    document.addEventListener('click', (e) => {
      if (!searchContainer.contains(e.target)) {
        searchDropdown.classList.add('hidden');
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        searchDropdown.classList.add('hidden');
      }
    });

    /* ==========================================================
       9. Event Listeners & Mobile Drawer Handlers
       ========================================================== */
    playPauseBtn.addEventListener('click', togglePlayPause);
    nextBtn.addEventListener('click', playNext);
    prevBtn.addEventListener('click', playPrevious);

    // Filter Tabs
    function updateTabStyles(activeTabId) {
      document.querySelectorAll('#tabGroup .tab-btn').forEach(btn => {
        if (btn.id === activeTabId) {
          btn.className = 'tab-btn px-2.5 py-1 rounded-full bg-brand-500 text-white font-semibold text-[11px] shadow-sm whitespace-nowrap';
        } else {
          btn.className = 'tab-btn px-2.5 py-1 rounded-full bg-surface-elevated hover:bg-[#252535] text-slate-400 font-medium text-[11px] whitespace-nowrap transition-colors';
        }
      });
    }

    document.getElementById('filterAll').addEventListener('click', () => {
      updateTabStyles('filterAll');
      renderPlaylist('all');
    });
    document.getElementById('filterVpop').addEventListener('click', () => {
      updateTabStyles('filterVpop');
      renderPlaylist('vpop');
    });
    document.getElementById('filterGlobal').addEventListener('click', () => {
      updateTabStyles('filterGlobal');
      renderPlaylist('global');
    });
    document.getElementById('filterLofi').addEventListener('click', () => {
      updateTabStyles('filterLofi');
      renderPlaylist('lofi');
    });

    // Reset default playlist
    resetPlaylistBtn.addEventListener('click', () => {
      playlist = [...DEFAULT_PLAYLIST];
      try {
        localStorage.removeItem('lumina_playlist_v3');
      } catch (e) {}
      currentIndex = 0;
      playTrackAtIndex(0);
      updateTabStyles('filterAll');
      renderPlaylist('all');
      showToast('Đã khôi phục danh sách Top Hit mặc định');
    });

    // Mobile Drawer Open/Close
    function openDrawer() {
      queueSidebar.classList.remove('translate-x-full');
      queueBackdrop.classList.remove('hidden');
    }
    function closeDrawer() {
      queueSidebar.classList.add('translate-x-full');
      queueBackdrop.classList.add('hidden');
    }

    toggleQueueDrawerBtn.addEventListener('click', openDrawer);
    closeQueueBtn.addEventListener('click', closeDrawer);
    queueBackdrop.addEventListener('click', closeDrawer);
    desktopQueueToggle.addEventListener('click', () => {
      if (window.innerWidth < 1024) {
        openDrawer();
      } else {
        queueSidebar.classList.toggle('hidden');
      }
    });

    // Like button effect
    likeBtn.addEventListener('click', () => {
      likeBtn.classList.toggle('text-rose-500');
      likeBtn.classList.toggle('text-slate-400');
      const isLiked = likeBtn.classList.contains('text-rose-500');
      showToast(isLiked ? 'Đã thêm vào bài hát yêu thích' : 'Đã bỏ yêu thích');
    });

    // Notification Toast helper
    let toastTimeout;
    function showToast(message) {
      if (toastTimeout) clearTimeout(toastTimeout);
      toastMsg.textContent = message;
      toast.classList.remove('translate-y-[-100px]', 'opacity-0');
      toast.classList.add('translate-y-0', 'opacity-100');
      toastTimeout = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('translate-y-[-100px]', 'opacity-0');
      }, 3000);
    }

    // Keyboard Shortcuts (Space for Play/Pause, Left/Right for Seek)
    window.addEventListener('keydown', (e) => {
      if (['input', 'textarea'].includes(document.activeElement.tagName.toLowerCase())) return;

      if (e.code === 'Space') {
        e.preventDefault();
        togglePlayPause();
      } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.seekTo) {
          ytPlayer.seekTo(ytPlayer.getCurrentTime() + 5, true);
        }
      } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        if (ytPlayer && ytPlayer.getCurrentTime && ytPlayer.seekTo) {
          ytPlayer.seekTo(Math.max(0, ytPlayer.getCurrentTime() - 5), true);
        }
      } else if (e.code === 'KeyN') {
        playNext();
      }
    });

    /* ==========================================================
       10. Page Onload Initialization
       ========================================================== */
    window.onload = function() {
      lucide.createIcons();
      initWaveVisualizer();
      renderPlaylist();
      updateTrackDisplay();
    };
  </script>
</body>
</html>
